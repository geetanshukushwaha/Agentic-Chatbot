<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agentic Chatbot</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="/static/styles.css?v=chat-ui-cleanup-1" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
    <script src="/static/app.js?v=chat-ui-cleanup-1" defer></script>
  </head>

  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Chat sidebar">
        <div class="sidebar-heading">
          <div class="brand">Agentic Chatbot</div>
          <button
            id="sidebar-close"
            class="sidebar-control sidebar-close"
            type="button"
            aria-label="Close sidebar"
            title="Close sidebar"
          >
            <span class="close-icon" aria-hidden="true"></span>
          </button>
        </div>

        <button id="new-chat" class="btn btn-primary new-chat-button">
          + New chat
        </button>

        <nav id="conversations" class="conversation-list" aria-label="Conversations"></nav>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <main class="chat-panel">
        <div class="chat-toolbar">
          <button
            id="sidebar-toggle"
            class="sidebar-control sidebar-toggle"
            type="button"
            aria-label="Hide sidebar"
            aria-controls="sidebar"
            aria-expanded="true"
            title="Hide sidebar"
          >
            <span class="menu-icon" aria-hidden="true"></span>
          </button>
        </div>

        <section id="messages" aria-live="polite">
          <div id="welcome" class="welcome-message">
            <p>How can I help?</p>
          </div>
        </section>

        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <div class="composer-area">
          <span id="status" class="status-text">Ready</span>

          <form id="composer" class="input-group">
            <textarea
              id="message"
              class="form-control"
              rows="1"
              maxlength="8000"
              placeholder="Message the assistant..."
              required
            ></textarea>
            <button id="send" class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>
      </main>
    </div>

    <div
      id="conversation-context-menu"
      class="conversation-context-menu"
      role="menu"
      aria-label="Conversation actions"
      hidden
    >
      <button id="delete-conversation-action" type="button" role="menuitem">
        Delete conversation
      </button>
    </div>
  </body>
</html>
