<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    >
    <title>Agentic Chatbot</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <link href="/static/styles.css?v=chat-controls-7" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
    <script src="/static/app.js?v=chat-controls-1" defer></script>
  </head>

  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Chat sidebar">
        <div class="sidebar-heading">
          <div class="brand">Agentic Chatbot</div>
          <button
            id="sidebar-close"
            class="sidebar-control sidebar-close"
            type="button"
            aria-label="Close sidebar"
            title="Close sidebar"
          >
            <span class="close-icon" aria-hidden="true"></span>
          </button>
        </div>

        <button id="new-chat" class="btn btn-primary new-chat-button" type="button">
          New chat
        </button>

        <nav id="conversations" class="conversation-list" aria-label="Conversations"></nav>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <main class="chat-panel">
        <div class="chat-controls">
          <button
            id="sidebar-toggle"
            class="sidebar-control sidebar-toggle"
            type="button"
            aria-label="Hide sidebar"
            aria-controls="sidebar"
            aria-expanded="true"
            title="Hide sidebar"
          >
            <span class="menu-icon" aria-hidden="true"></span>
          </button>
          <button
            id="export-chat"
            class="export-chat-button"
            type="button"
            aria-label="Export chat"
            title="Export chat"
            disabled
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
        </div>

        <section id="messages" aria-live="polite">
          <div id="message-thread" class="message-thread">
            <div id="welcome" class="welcome-message">
              <p>How can I help?</p>
            </div>
          </div>
        </section>

        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <div class="composer-area">
          <form id="composer" class="chat-composer">
            <textarea
              id="message"
              class="form-control"
              rows="1"
              maxlength="8000"
              placeholder="Message the assistant..."
              required
            ></textarea>
            <button id="send" class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>
      </main>
    </div>

    <div
      id="conversation-context-menu"
      class="conversation-context-menu"
      role="menu"
      aria-label="Conversation actions"
      hidden
    >
      <button id="delete-conversation-action" type="button" role="menuitem">
        Delete conversation
      </button>
    </div>
  </body>
</html>
